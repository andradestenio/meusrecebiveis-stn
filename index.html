a</h2><label class="field">Comprador</label><input name="buyer" required maxlength="100"><label class="field">Produto</label><input name="product" required maxlength="150"><label class="field">Valor da venda (R$)</label><input name="value" type="number" min="0.01" step="0.01" required><div class="dialogbuttons"><button type="button" onclick="saleDialog.close()">Cancelar</button><button class="primary" id="saleSubmit">Cadastrar venda</button></div></form></dialog><script>const KEY='meus_recebiveis_v3';const initial=[{id:'elza',buyer:'Elza Gabriela',product:'iPhone 17 Pro Max · Laranja',value:7500,payments:[]},{id:'suiany',buyer:'Suiany',product:'iPad Pro · 11 polegadas',value:8500,payments:[]}];let data;try{const raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):structuredClone(initial);if(!Array.isArray(data))throw Error('Formato inválido')}catch(e){data=structuredClone(initial);alert('Não foi possível ler os dados locais. Se tiver backup, importe para restaurar.')}let selected=null;const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const paid=s=>s.payments.reduce((a,p)=>a+Number(p.amount),0);function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Não foi possível salvar neste navegador. Exporte um backup e verifique as permissões de armazenamento.')}}function render(){let total=data.reduce((a,s)=>a+Number(s.value),0),received=data.reduce((a,s)=>a+paid(s),0);document.getElementById('total').textContent=money(total);document.getElementById('received').textContent=money(received);document.getElementById('due').textContent=money(total-received);document.getElementById('count').textContent=`(${data.length})`;document.getElementById('sales').innerHTML=data.map(s=>{let p=paid(s),due=Math.max(0,s.value-p),pct=Math.min(100,p/s.value*100);return `<article class="card sale"><div class="row"><h3>${esc(s.buyer)}</h3><span class="pill">${due<.005?'Quitado':'Em aberto'}</span></div><div class="product">${esc(s.product)}</div><div class="numbers"><div><span class="label">Valor da venda</span><strong>${money(s.value)}</strong></div><div><span class="label">Saldo devedor</span><strong>${money(due)}</strong></div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="row"><small class="muted">${pct.toFixed(1).replace('.',',')}% recebido · ${money(p)}</small><button class="emerald" ${due<.005?'disabled':''} onclick="showPay('${esc(s.id)}')">+ Pagamento</button></div><div style="margin-top:12px"><button onclick="editSale('${esc(s.id)}')">✎ Editar venda</button> <button onclick="exportSalePDF('${esc(s.id)}')">↓ PDF da venda</button></div><div class="history"><div class="label">Histórico de pagamentos</div>${s.payments.length?s.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="payment"><div><b>${money(x.amount)}</b><br><span class="muted">${esc(x.date.split('-').reverse().join('/'))} · ${esc(x.method)}${x.note?' · '+esc(x.note):''}</span></div><button onclick="editPayment('${esc(s.id)}','${esc(x.id)}')">Editar</button></div>`).join(''):'<p class="muted" style="font-size:13px">Nenhum pagamento registrado.</p>'}</div></article>`}).join('')}function showPay(id){selected={sale:id};const s=data.find(x=>x.id===id);payForm.reset();payForm.elements.date.value=new Date().toLocaleDateString('en-CA');payFor.textContent=s.buyer+' · Saldo '+money(s.value-paid(s));payDialog.showModal()}payForm.onsubmit=e=>{e.preventDefault();let s=data.find(x=>x.id===selected.sale),f=payForm.elements,amount=Number(f.amount.value),existing=selected.payment?s.payments.find(x=>x.id===selected.payment):null,remaining=s.value-paid(s)+(existing?Number(existing.amount):0);if(!Number.isFinite(amount)||amount<=0||amount>remaining+.001){alert('Informe um valor maior que zero e não superior ao saldo devedor.');return}let obj={id:existing?.id||crypto.randomUUID(),amount,date:f.date.value,method:f.method.value,note:f.note.value.trim()};if(existing)Object.assign(existing,obj);else s.payments.push(obj);save();render();payDialog.close()};function editPayment(sid,pid){showPay(sid);selected.payment=pid;let p=data.find(s=>s.id===sid).payments.find(p=>p.id===pid);payForm.elements.amount.value=p.amount;payForm.elements.date.value=p.date;payForm.elements.method.value=p.method;payForm.elements.note.value=p.note||''}let editingSaleId=null;function showSale(){editingSaleId=null;saleForm.reset();document.getElementById('saleTitle').textContent='Nova venda';document.getElementById('saleSubmit').textContent='Cadastrar venda';saleDialog.showModal()}function editSale(id){const s=data.find(x=>x.id===id);if(!s)return;editingSaleId=id;saleForm.reset();saleForm.elements.buyer.value=s.buyer;saleForm.elements.product.value=s.product;saleForm.elements.value.value=s.value;document.getElementById('saleTitle').textContent='Editar venda';document.getElementById('saleSubmit').textContent='Salvar alterações';saleDialog.showModal()}saleForm.onsubmit=e=>{e.preventDefault();let f=saleForm.elements,value=Number(f.value.value);if(!Number.isFinite(value)||value<=0)return;const buyer=f.buyer.value.trim(),product=f.product.value.trim();if(!buyer||!product)return;if(editingSaleId){const s=data.find(x=>x.id===editingSaleId);if(!s)return;const received=paid(s);if(value+0.001<received){alert('O novo valor não pode ser menor que o total já recebido ('+money(received)+').');return}Object.assign(s,{buyer,product,value})}else data.push({id:crypto.randomUUID(),buyer,product,value,payments:[]});save();render();saleDialog.close()};function exportData(){const blob=new Blob([JSON.stringify({app:'Meus Recebíveis',version:3,exportedAt:new Date().toISOString(),sales:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Meus_Recebiveis_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importData(e){const file=e.target.files?.[0];if(!file)return;try{const json=JSON.parse(await file.text());if(json.app!=='Meus Recebíveis'||!Array.isArray(json.sales)||!json.sales.every(s=>typeof s.buyer==='string'&&typeof s.product==='string'&&Number.isFinite(s.value)&&s.value>0&&Array.isArray(s.payments)&&s.payments.every(p=>Number.isFinite(p.amount)&&p.amount>0&&typeof p.date==='string')))throw Error('Backup incompatível');if(!confirm('A importação substituirá os dados atuais. Deseja continuar?'))return;data=json.sales;save();render();alert('Backup restaurado com sucesso.')}catch(err){alert('Não foi possível importar: '+err.message)}finally{e.target.value=''}}
function exportSalePDF(id){
 const s=data.find(x=>x.id===id);if(!s)return;
 const total=paid(s),saldo=Math.max(0,s.value-total);
 const rows=s.payments.slice().sort((a,b)=>a.date.localeCompare(b.date)).map((p,i)=>
 `<tr><td>${i+1}</td><td>${esc(p.date.split('-').reverse().join('/'))}</td><td>${esc(p.method)}</td><td>${esc(p.note||'—')}</td><td class="num">${money(p.amount)}</td></tr>`).join('');
 const page=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Recebimentos - ${esc(s.buyer)}</title>
 <style>@page{size:A4;margin:17mm}body{font:14px Arial,sans-serif;color:#17253a;margin:0}header{background:#0b1830;color:white;padding:24px;border-radius:12px}h1{margin:0;font-size:23px}header small{color:#b5e9dc}.meta{margin:24px 0;line-height:1.8}.cards{display:flex;gap:10px;margin:18px 0}.card{flex:1;background:#f1f6f8;padding:15px;border-radius:9px}.card b{display:block;margin-top:8px;font-size:18px}.green{color:#079d76}table{width:100%;border-collapse:collapse;margin-top:15px;font-size:12px}th{background:#173b57;color:white;text-align:left}th,td{padding:10px 8px;border-bottom:1px solid #dde5ec}.num{text-align:right}footer{margin-top:32px;color:#6c7c8d;font-size:11px}.print{margin:20px 0;padding:11px 18px;background:#079d76;color:white;border:0;border-radius:8px;cursor:pointer}@media print{.print{display:none}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head>
 <body><header><h1>MEUS RECEBÍVEIS</h1><small>Relatório individual de venda e recebimentos</small></header>
 <div class="meta"><strong>Comprador(a):</strong> ${esc(s.buyer)}<br><strong>Produto:</strong> ${esc(s.product)}<br><strong>Emitido em:</strong> ${new Date().toLocaleString('pt-BR')}</div>
 <div class="cards"><div class="card">Valor da venda<b>${money(s.value)}</b></div><div class="card">Total recebido<b class="green">${money(total)}</b></div><div class="card">Saldo pendente<b>${money(saldo)}</b></div></div>
 <h2>Histórico de pagamentos</h2><table><thead><tr><th>#</th><th>Data</th><th>Forma</th><th>Observação</th><th class="num">Valor</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Nenhum pagamento registrado.</td></tr>'}</tbody></table>
 <footer>Meus Recebíveis · Relatório gerado a partir dos registros do sistema.</footer><button class="print" onclick="window.print()">Imprimir / Salvar em PDF</button></body></html>`;
 const win=window.open('','_blank');
 if(!win){alert('Permita a abertura de pop-ups para exportar o PDF desta venda.');return}
 win.document.open();win.document.write(page);win.document.close();
}
render();</script></body></html>
